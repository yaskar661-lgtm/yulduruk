name: YouTube Live M3U8 Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  push:
    paths:
      - 'streams.txt'
      - 'generate.py'
      - '.github/workflows/main.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & dependencies
        run: |
          pip install --upgrade pip yt-dlp requests playwright
          playwright install chromium
          echo "yt-dlp: $(yt-dlp --version)"

      - name: Setup Cloudflare WARP
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iptables
          curl -fsSL https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -o wgcf
          chmod +x wgcf
          sudo mv wgcf /usr/local/bin/
          wgcf register --accept-tos
          wgcf generate
          sudo mkdir -p /etc/wireguard
          sudo cp wgcf-profile.conf /etc/wireguard/wgcf.conf
          sudo wg-quick up /etc/wireguard/wgcf.conf || true

      - name: Create directories
        run: |
          mkdir -p logos channels
          touch logos/.gitkeep channels/.gitkeep

      - name: Run playlist generator
        run: |
          echo "Starting generation..."
          sh exec_grabber.sh
          echo "Generation complete"

      - name: Commit and push changes
        run: |
          # Disconnect Cloudflare WARP so GitHub push doesn't time out
          echo "Disconnecting Cloudflare WARP..."
          sudo wg-quick down /etc/wireguard/wgcf.conf || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add streams*.m3u8 epg.xml stats.json logos/ channels/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update playlist - $(date -u +'%Y-%m-%d %H:%M UTC')"
          
          # Add a simple retry loop for extra reliability against network blips
          for i in {1..3}; do
            git push && break || {
              echo "Push failed, retrying in 5 seconds ($i/3)..."
              sleep 5
            }
          done
